<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayStrix - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --dark: #2d3436;
            --light: #f5f6fa;
            --success: #00b894;
            --danger: #e84393;
            --warning: #fdcb6e;
        }

        body {
            background: linear-gradient(135deg, var(--dark) 0%, #4a4a4a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 30px;
        }

        .logo-text {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
        }

        h1 {
            color: var(--dark);
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark);
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary);
            outline: none;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn:hover {
            background: var(--secondary);
            transform: translateY(-2px);
        }

        .btn-back {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            margin-top: 15px;
        }

        .btn-back:hover {
            background: var(--primary);
            color: white;
        }

        .error-message {
            color: var(--danger);
            margin-top: 10px;
            font-size: 0.9rem;
            display: none;
        }

        .admin-panel {
            display: none;
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin: 20px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .admin-title {
            font-size: 1.8rem;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .admin-tab {
            padding: 10px 20px;
            cursor: pointer;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .admin-tab.active {
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
        }

        .admin-content {
            display: none;
        }

        .admin-content.active {
            display: block;
        }

        .games-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .games-table th, .games-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .games-table th {
            background: #f8f9fa;
            font-weight: 600;
        }

        .games-table tr:hover {
            background: #f8f9fa;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .edit-btn {
            background: var(--warning);
            color: var(--dark);
        }

        .delete-btn {
            background: var(--danger);
            color: white;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .game-thumb {
            width: 60px;
            height: 40px;
            background: #f8f9fa;
            background-size: cover;
            background-position: center;
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            
            .admin-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            
            .games-table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <!-- Login Section -->
    <div class="login-container" id="loginSection">
        <div class="logo">
            <i class="fas fa-gamepad"></i>
            <span class="logo-text">PlayStrix</span>
        </div>
        
        <h1>Admin Access</h1>
        <p class="subtitle">Enter password to continue</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="adminPassword">Password</label>
                <input type="password" id="adminPassword" class="form-control" placeholder="Enter admin password" required>
                <div class="error-message" id="errorMessage">Incorrect password. Please try again.</div>
            </div>
            
            <button type="submit" class="btn">
                <i class="fas fa-lock"></i> Access Admin Panel
            </button>
        </form>
        
        <a href="index.html" class="btn btn-back">
            <i class="fas fa-arrow-left"></i> Back to Store
        </a>
    </div>

    <!-- Admin Panel (Hidden until login) -->
    <div class="admin-panel" id="adminPanel">
        <div class="admin-header">
            <h1 class="admin-title">
                <i class="fas fa-cogs"></i>
                Game Management
            </h1>
            <div>
                <button class="btn" id="addGameBtn">Add New Game</button>
                <button class="btn btn-back" id="logoutBtn">Logout</button>
            </div>
        </div>

        <div class="admin-tabs">
            <div class="admin-tab active" data-tab="games-list">Games List</div>
            <div class="admin-tab" data-tab="add-game">Add/Edit Game</div>
        </div>

        <!-- Games List Tab -->
        <div class="admin-content active" id="games-list">
            <h2>Your Games</h2>
            <table class="games-table">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Discount</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="gamesTableBody">
                    <!-- Games will be populated by JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- Add/Edit Game Tab -->
        <div class="admin-content" id="add-game">
            <h2 id="form-title">Add New Game</h2>
            <form id="gameForm">
                <input type="hidden" id="gameId">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="gameTitle">Game Title *</label>
                        <input type="text" id="gameTitle" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="gameCategory">Category *</label>
                        <select id="gameCategory" class="form-control" required>
                            <option value="">Select Category</option>
                            <option value="Action">Action</option>
                            <option value="Adventure">Adventure</option>
                            <option value="RPG">RPG</option>
                            <option value="Strategy">Strategy</option>
                            <option value="Sports">Sports</option>
                            <option value="Simulation">Simulation</option>
                            <option value="Indie">Indie</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="gameDescription">Description *</label>
                    <textarea id="gameDescription" class="form-control" rows="4" required></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="gamePrice">Price ($) *</label>
                        <input type="number" id="gamePrice" class="form-control" min="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="gameDiscount">Discount (%)</label>
                        <input type="number" id="gameDiscount" class="form-control" min="0" max="100" value="0">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="gameImage">Image Path</label>
                    <input type="text" id="gameImage" class="form-control" placeholder="images/game-images/game-name.jpg">
                    <small>Use path like: images/game-images/your-game.jpg</small>
                </div>
                
                <div class="form-group">
                    <button type="submit" class="btn" id="saveGameBtn">Save Game</button>
                    <button type="button" class="btn btn-back" id="cancelEditBtn" style="display: none;">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // PASSWORD PROTECTION
        const ADMIN_PASSWORD = "shubham2007";

        class AdminPanel {
            constructor() {
                this.storageKey = 'playstrix-games';
                this.init();
            }

            init() {
                this.setupEventListeners();
                
                // Check if already logged in
                if (localStorage.getItem('adminLoggedIn') === 'true') {
                    this.showAdminPanel();
                }
            }

            setupEventListeners() {
                // Login form
                document.getElementById('loginForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleLogin();
                });

                // Logout button
                document.getElementById('logoutBtn').addEventListener('click', () => {
                    this.handleLogout();
                });

                // Game form submission
                document.getElementById('gameForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleSaveGame();
                });

                // Add game button
                document.getElementById('addGameBtn').addEventListener('click', () => {
                    this.showAddGameForm();
                });

                // Cancel edit
                document.getElementById('cancelEditBtn').addEventListener('click', () => {
                    this.resetForm();
                });

                // Tab switching
                document.querySelectorAll('.admin-tab').forEach(tab => {
                    tab.addEventListener('click', () => {
                        this.switchTab(tab.dataset.tab);
                    });
                });

                // Delegate events for dynamic content
                document.addEventListener('click', (e) => {
                    if (e.target.closest('.edit-btn')) {
                        this.handleEditGame(e.target.closest('.edit-btn').dataset.id);
                    }
                    if (e.target.closest('.delete-btn')) {
                        this.handleDeleteGame(e.target.closest('.delete-btn').dataset.id);
                    }
                });
            }

            handleLogin() {
                const password = document.getElementById('adminPassword').value;
                const errorMessage = document.getElementById('errorMessage');

                if (password === ADMIN_PASSWORD) {
                    localStorage.setItem('adminLoggedIn', 'true');
                    this.showAdminPanel();
                } else {
                    errorMessage.style.display = 'block';
                    document.getElementById('adminPassword').value = '';
                    setTimeout(() => {
                        errorMessage.style.display = 'none';
                    }, 3000);
                }
            }

            handleLogout() {
                localStorage.removeItem('adminLoggedIn');
                this.showLoginForm();
            }

            showAdminPanel() {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                this.renderGamesTable();
            }

            showLoginForm() {
                document.getElementById('loginSection').style.display = 'block';
                document.getElementById('adminPanel').style.display = 'none';
                document.getElementById('adminPassword').value = '';
            }

            getGames() {
                return JSON.parse(localStorage.getItem(this.storageKey) || '[]');
            }

            setGames(games) {
                localStorage.setItem(this.storageKey, JSON.stringify(games));
            }

            addGame(gameData) {
                const games = this.getGames();
                const newId = games.length > 0 ? Math.max(...games.map(g => g.id)) + 1 : 1;
                const game = { id: newId, ...gameData };
                games.push(game);
                this.setGames(games);
                return game;
            }

            updateGame(id, gameData) {
                const games = this.getGames();
                const index = games.findIndex(g => g.id === id);
                if (index !== -1) {
                    games[index] = { ...games[index], ...gameData };
                    this.setGames(games);
                    return games[index];
                }
                return null;
            }

            deleteGame(id) {
                const games = this.getGames().filter(g => g.id !== id);
                this.setGames(games);
            }

            getImagePath(game) {
                if (game.image && game.image.startsWith('http')) {
                    return game.image;
                } else if (game.image) {
                    return game.image;
                } else {
                    return `https://via.placeholder.com/60x40/6c5ce7/ffffff?text=${encodeURIComponent(game.title.substring(0, 3))}`;
                }
            }

            renderGamesTable() {
                const games = this.getGames();
                const tbody = document.getElementById('gamesTableBody');
                
                tbody.innerHTML = games.map(game => `
                    <tr>
                        <td>
                            <div class="game-thumb" style="background-image: url('${this.getImagePath(game)}')"></div>
                        </td>
                        <td>${game.title}</td>
                        <td>${game.category}</td>
                        <td>$${game.price.toFixed(2)}</td>
                        <td>${game.discount > 0 ? `${game.discount}%` : '-'}</td>
                        <td class="action-buttons">
                            <button class="action-btn edit-btn" data-id="${game.id}">Edit</button>
                            <button class="action-btn delete-btn" data-id="${game.id}">Delete</button>
                        </td>
                    </tr>
                `).join('');
            }

            handleSaveGame() {
                const formData = new FormData(document.getElementById('gameForm'));
                const gameData = {
                    title: formData.get('title'),
                    description: formData.get('description'),
                    category: formData.get('category'),
                    price: parseFloat(formData.get('price')),
                    discount: parseInt(formData.get('discount')) || 0,
                    image: formData.get('image') || ''
                };

                const editingId = document.getElementById('gameId').value;
                
                if (editingId) {
                    this.updateGame(parseInt(editingId), gameData);
                } else {
                    this.addGame(gameData);
                }

                this.renderGamesTable();
                this.resetForm();
                alert('Game saved successfully!');
            }

            handleEditGame(id) {
                const game = this.getGames().find(g => g.id === parseInt(id));
                if (game) {
                    document.getElementById('gameId').value = game.id;
                    document.getElementById('gameTitle').value = game.title;
                    document.getElementById('gameDescription').value = game.description;
                    document.getElementById('gameCategory').value = game.category;
                    document.getElementById('gamePrice').value = game.price;
                    document.getElementById('gameDiscount').value = game.discount;
                    document.getElementById('gameImage').value = game.image;

                    document.getElementById('form-title').textContent = 'Edit Game';
                    document.getElementById('saveGameBtn').textContent = 'Update Game';
                    document.getElementById('cancelEditBtn').style.display = 'inline-block';

                    this.switchTab('add-game');
                }
            }

            handleDeleteGame(id) {
                if (confirm('Are you sure you want to delete this game?')) {
                    this.deleteGame(parseInt(id));
                    this.renderGamesTable();
                    alert('Game deleted successfully!');
                }
            }

            switchTab(tabName) {
                document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.admin-content').forEach(c => c.classList.remove('active'));
                
                document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
                document.getElementById(tabName).classList.add('active');
            }

            showAddGameForm() {
                this.resetForm();
                this.switchTab('add-game');
            }

            resetForm() {
                document.getElementById('gameForm').reset();
                document.getElementById('gameId').value = '';
                document.getElementById('form-title').textContent = 'Add New Game';
                document.getElementById('saveGameBtn').textContent = 'Save Game';
                document.getElementById('cancelEditBtn').style.display = 'none';
            }
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', () => {
            window.adminPanel = new AdminPanel();
        });
    </script>
</body>
</html>
