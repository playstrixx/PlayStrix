<script>
    // FIREBASE CONFIG
    const FIREBASE_CONFIG = {
        apiKey: "AIzaSyBt5cpRvPefpaoawHPx3CLKu5AtT6ByD0E",
        authDomain: "plastrix-1d02a.firebaseapp.com",
        projectId: "plastrix-1d02a",
        storageBucket: "plastrix-1d02a.firebasestorage.app",
        messagingSenderId: "93817630445",
        appId: "1:93817630445:web:946c2ab7e0cc0434c4a6e4",
        measurementId: "G-4SZ8L00YS6"
    };

    const ADMIN_PASSWORD = "shubham2007";

    class AdminPanel {
        constructor() {
            this.storageKey = 'playstrix-games';
            this.db = null;
            this.init();
        }

        async init() {
            try {
                // Initialize Firebase
                firebase.initializeApp(FIREBASE_CONFIG);
                this.db = firebase.firestore();
                console.log('🔥 Admin Firebase Connected!');
                
                this.setupEventListeners();
                
                // Check if already logged in
                if (localStorage.getItem('adminLoggedIn') === 'true') {
                    this.showAdminPanel();
                }
            } catch (error) {
                console.error('Firebase init failed:', error);
                alert('Firebase connection failed. Please check console for details.');
            }
        }

        setupEventListeners() {
            // Login form
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                this.handleLogin();
            });

            // Logout button
            document.getElementById('logoutBtn').addEventListener('click', () => {
                this.handleLogout();
            });

            // Game form submission
            document.getElementById('gameForm').addEventListener('submit', (e) => {
                e.preventDefault();
                this.handleSaveGame();
            });

            // Add game button
            document.getElementById('addGameBtn').addEventListener('click', () => {
                this.showAddGameForm();
            });

            // Cancel edit
            document.getElementById('cancelEditBtn').addEventListener('click', () => {
                this.resetForm();
            });

            // Tab switching
            document.querySelectorAll('.admin-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    this.switchTab(tab.dataset.tab);
                });
            });

            // Delegate events for dynamic content
            document.getElementById('gamesTableBody').addEventListener('click', (e) => {
                if (e.target.classList.contains('edit-btn')) {
                    this.handleEditGame(e.target.dataset.id);
                }
                if (e.target.classList.contains('delete-btn')) {
                    this.handleDeleteGame(e.target.dataset.id);
                }
            });
        }

        handleLogin() {
            const password = document.getElementById('adminPassword').value;
            const errorMessage = document.getElementById('errorMessage');

            if (password === ADMIN_PASSWORD) {
                localStorage.setItem('adminLoggedIn', 'true');
                this.showAdminPanel();
            } else {
                errorMessage.style.display = 'block';
                document.getElementById('adminPassword').value = '';
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 3000);
            }
        }

        handleLogout() {
            localStorage.removeItem('adminLoggedIn');
            this.showLoginForm();
        }

        showAdminPanel() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            this.loadAndRenderGames();
        }

        showLoginForm() {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
            document.getElementById('adminPassword').value = '';
        }

        async loadAndRenderGames() {
            try {
                const games = await this.loadGamesFromFirebase();
                this.renderGamesTable(games);
            } catch (error) {
                console.error('Error loading games:', error);
                // Show empty state
                this.renderGamesTable([]);
            }
        }

        async loadGamesFromFirebase() {
            try {
                const snapshot = await this.db.collection('games').orderBy('id').get();
                const games = snapshot.docs.map(doc => {
                    const data = doc.data();
                    return {
                        ...data,
                        id: parseInt(data.id) || data.id
                    };
                });
                
                console.log('Loaded games from Firebase:', games);
                return games;
            } catch (error) {
                console.error('Error loading from Firebase:', error);
                return [];
            }
        }

        getDefaultGames() {
            return [
                {
                    id: 1,
                    title: "Cyber Realm",
                    description: "Immerse yourself in a futuristic open world with stunning graphics and endless possibilities.",
                    fullDescription: "Cyber Realm is an epic open-world adventure set in a breathtaking cyberpunk future. Explore neon-lit cities, engage in high-stakes combat, and uncover the mysteries of a world torn between technology and humanity.",
                    category: "Action",
                    price: 3499,
                    discount: 0,
                    image: "./images/gimages/cyber-realm.jpg",
                    features: ["Open World", "Character Customization", "Multiple Endings", "Online Co-op"]
                },
                {
                    id: 2,
                    title: "Shadow Legends",
                    description: "A dark fantasy RPG with deep character customization and epic boss battles.",
                    fullDescription: "Enter the dark and mystical world of Shadow Legends, where ancient magic and terrifying creatures await. Create your unique hero from multiple classes and races.",
                    category: "RPG",
                    price: 2799,
                    discount: 20,
                    image: "./images/gimages/shadow-legends.jpg",
                    features: ["Class System", "Epic Boss Battles", "Magic System", "Branching Storyline"]
                }
            ];
        }

        async addGame(gameData) {
            const games = await this.loadGamesFromFirebase();
            const newId = games.length > 0 ? Math.max(...games.map(g => g.id)) + 1 : 1;
            
            const game = { 
                id: newId, 
                ...gameData,
                features: gameData.features ? gameData.features.split(',').map(f => f.trim()).filter(f => f) : ["Amazing Gameplay", "Great Graphics"]
            };
            
            console.log('Adding game to Firebase:', game);
            
            // Save to Firebase
            await this.db.collection('games').doc(newId.toString()).set(game);
            
            return game;
        }

        async updateGame(id, gameData) {
            const games = await this.loadGamesFromFirebase();
            const gameIndex = games.findIndex(g => g.id === id);
            
            if (gameIndex !== -1) {
                const updatedGame = { 
                    ...games[gameIndex], 
                    ...gameData,
                    features: gameData.features ? gameData.features.split(',').map(f => f.trim()).filter(f => f) : games[gameIndex].features
                };
                
                console.log('Updating game in Firebase:', updatedGame);
                
                // Update in Firebase
                await this.db.collection('games').doc(id.toString()).set(updatedGame);
                
                return updatedGame;
            }
            throw new Error('Game not found');
        }

        async deleteGame(id) {
            console.log('Deleting game from Firebase:', id);
            await this.db.collection('games').doc(id.toString()).delete();
        }

        getImagePath(game) {
            if (!game || !game.image) {
                return `https://via.placeholder.com/60x40/6c5ce7/ffffff?text=No+Img`;
            }
            if (game.image.startsWith('http')) {
                return game.image;
            }
            return game.image;
        }

        renderGamesTable(games) {
            const tbody = document.getElementById('gamesTableBody');
            
            if (!games || games.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 40px; color: #666;">
                            <i class="fas fa-gamepad fa-2x" style="margin-bottom: 10px; display: block; color: var(--primary);"></i>
                            <h3>No Games Yet</h3>
                            <p>Add your first game using the "Add New Game" button!</p>
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = games.map(game => `
                <tr>
                    <td>
                        <div class="game-thumb" style="background-image: url('${this.getImagePath(game)}')"></div>
                    </td>
                    <td><strong>${game.title}</strong></td>
                    <td>${game.category}</td>
                    <td>₹${game.price.toLocaleString('en-IN')}</td>
                    <td>${game.discount > 0 ? `${game.discount}%` : 'No discount'}</td>
                    <td class="action-buttons">
                        <button class="action-btn edit-btn" data-id="${game.id}">Edit</button>
                        <button class="action-btn delete-btn" data-id="${game.id}">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        async handleSaveGame() {
            const gameData = {
                title: document.getElementById('gameTitle').value,
                description: document.getElementById('gameDescription').value,
                fullDescription: document.getElementById('gameFullDescription').value,
                category: document.getElementById('gameCategory').value,
                price: parseInt(document.getElementById('gamePrice').value),
                discount: parseInt(document.getElementById('gameDiscount').value) || 0,
                image: document.getElementById('gameImage').value || './images/gimages/game.jpg',
                features: document.getElementById('gameFeatures').value
            };

            // Validate required fields
            if (!gameData.title || !gameData.description || !gameData.fullDescription || !gameData.category || !gameData.price) {
                alert('Please fill all required fields (Title, Description, Full Description, Category, Price)');
                return;
            }

            const editingId = document.getElementById('gameId').value;
            
            try {
                if (editingId) {
                    await this.updateGame(parseInt(editingId), gameData);
                } else {
                    await this.addGame(gameData);
                }

                this.showSuccessMessage();
                await this.loadAndRenderGames();
                this.resetForm();
                this.switchTab('games-list');
                
            } catch (error) {
                console.error('Error saving game:', error);
                alert('Error saving game: ' + error.message);
            }
        }

        showSuccessMessage() {
            const successMsg = document.getElementById('successMessage');
            successMsg.style.display = 'block';
            setTimeout(() => {
                successMsg.style.display = 'none';
            }, 5000);
        }

        async handleEditGame(id) {
            const games = await this.loadGamesFromFirebase();
            const game = games.find(g => g.id === parseInt(id));
            
            if (game) {
                document.getElementById('gameId').value = game.id;
                document.getElementById('gameTitle').value = game.title;
                document.getElementById('gameDescription').value = game.description;
                document.getElementById('gameFullDescription').value = game.fullDescription;
                document.getElementById('gameCategory').value = game.category;
                document.getElementById('gamePrice').value = game.price;
                document.getElementById('gameDiscount').value = game.discount;
                document.getElementById('gameImage').value = game.image || '';
                document.getElementById('gameFeatures').value = game.features ? game.features.join(', ') : '';

                document.getElementById('form-title').textContent = 'Edit Game';
                document.getElementById('saveGameBtn').textContent = 'Update Game';
                document.getElementById('cancelEditBtn').style.display = 'inline-block';

                this.switchTab('add-game');
            } else {
                alert('Game not found!');
            }
        }

        async handleDeleteGame(id) {
            if (confirm('Are you sure you want to delete this game? This will remove it from the live website immediately.')) {
                try {
                    await this.deleteGame(parseInt(id));
                    this.showSuccessMessage();
                    await this.loadAndRenderGames();
                } catch (error) {
                    alert('Error deleting game: ' + error.message);
                }
            }
        }

        switchTab(tabName) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.admin-content').forEach(c => c.classList.remove('active'));
            
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        showAddGameForm() {
            this.resetForm();
            this.switchTab('add-game');
        }

        resetForm() {
            document.getElementById('gameForm').reset();
            document.getElementById('gameId').value = '';
            document.getElementById('form-title').textContent = 'Add New Game';
            document.getElementById('saveGameBtn').textContent = 'Save Game';
            document.getElementById('cancelEditBtn').style.display = 'none';
            document.getElementById('gameFeatures').value = '';
        }
    }

    // Initialize the application
    document.addEventListener('DOMContentLoaded', () => {
        window.adminPanel = new AdminPanel();
    });
</script>
